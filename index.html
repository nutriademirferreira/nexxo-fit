<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexxo | O ponto onde tudo se conecta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D1315; --bg-card:#161F22;
    --line-strong:rgba(244,247,246,0.18);
    --signal:#00E5A0;
    --text:#F4F7F6; --text-muted:#93A3A0; --text-faint:#5E6E6B;
    --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-body); line-height:1.6;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{text-align:center; max-width:420px;}
  .logo{
    font-family:var(--font-display); font-weight:700; font-size:22px;
    display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:28px;
  }
  .logo .dot{width:7px; height:7px; border-radius:50%; background:var(--signal);}
  h1{
    font-family:var(--font-display); font-weight:600; letter-spacing:-0.01em;
    font-size:clamp(26px,5vw,36px); line-height:1.2; margin-bottom:14px;
  }
  h1 em{font-style:normal; color:var(--signal);}
  .status{
    font-family:var(--font-mono); font-size:12px; color:var(--text-faint);
    text-transform:uppercase; letter-spacing:0.06em; margin-bottom:22px;
  }
  p{color:var(--text-muted); font-size:15px; margin-bottom:32px;}
  .btn{
    display:inline-flex; align-items:center; gap:8px; background:var(--signal); color:#04241A;
    font-family:var(--font-body); font-weight:600; font-size:15px; padding:14px 28px;
    border-radius:999px; text-decoration:none;
  }
  .footer-note{margin-top:36px; font-size:12px; color:var(--text-faint); font-family:var(--font-mono);}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><span class="dot"></span>nexxo</div>
  <div class="status">site em construção</div>
  <h1>O ponto onde <em>tudo se conecta</em>.</h1>
  <p>Nutrição e treino desenhados juntos, como um sistema só. A página completa está a caminho — mas os planos já estão disponíveis.</p>
  <a href="/planos/" class="btn">Ver planos</a>
  <p class="footer-note">nexxo · @consultoria.nexxo</p>
</div>
</body>
</html>
