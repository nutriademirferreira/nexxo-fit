<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexxo | O ponto onde tudo se conecta</title>
<link rel="icon" href="/assets/favicon.png">
<meta name="description" content="Nutrição e treino desenhados juntos, como um sistema só, não dois serviços separados competindo pela sua atenção.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nexxo.fit/">
<meta property="og:title" content="Nexxo | O ponto onde tudo se conecta">
<meta property="og:description" content="Nutrição e treino desenhados juntos, como um sistema só, não dois serviços separados competindo pela sua atenção.">
<meta property="og:image" content="https://nexxo.fit/assets/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Nexxo | O ponto onde tudo se conecta">
<meta name="twitter:description" content="Nutrição e treino desenhados juntos, como um sistema só, não dois serviços separados competindo pela sua atenção.">
<meta name="twitter:image" content="https://nexxo.fit/assets/og-image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141B1F;
    --orange:#F06A29; --orange-dim:rgba(240,106,41,0.14);
    --teal:#1BA892; --teal-dim:rgba(27,168,146,0.16);
    --text:#FFFFFF; --text-muted:rgba(255,255,255,0.78); --text-faint:rgba(255,255,255,0.55);
    --font-display:'Poppins',sans-serif; --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-body); line-height:1.6;
    min-height:100vh; display:flex; flex-direction:column; justify-content:center;
  }

  .video-wrap{position:relative; width:100%; line-height:0;}
  .video-wrap video{display:block; width:100%; height:auto;}
  .video-wrap::before{
    content:''; position:absolute; left:0; right:0; top:0; height:22%;
    background:linear-gradient(0deg, transparent 0%, var(--bg) 100%);
  }
  .video-wrap::after{
    content:''; position:absolute; left:0; right:0; bottom:0; height:30%;
    background:linear-gradient(180deg, transparent 0%, var(--bg) 100%);
  }

  .card{
    text-align:center; max-width:480px; margin:0 auto;
    padding:48px 24px 64px;
  }
  .status{
    font-family:var(--font-body); font-weight:600; font-size:11px; color:var(--teal);
    background:var(--teal-dim); display:inline-block; padding:6px 14px; border-radius:999px;
    text-transform:uppercase; letter-spacing:0.06em; margin-bottom:22px;
  }
  h1{
    font-family:var(--font-display); font-weight:700; letter-spacing:-0.01em;
    font-size:clamp(26px,5vw,36px); line-height:1.2; margin-bottom:14px; color:var(--text);
  }
  h1 em{font-style:normal; color:var(--orange);}
  p{color:var(--text-muted); font-size:15px; margin-bottom:32px;}
  .btn{
    display:inline-flex; align-items:center; gap:8px; background:var(--orange); color:#fff;
    font-family:var(--font-body); font-weight:600; font-size:15px; padding:14px 28px;
    border-radius:999px; text-decoration:none; transition:opacity .15s;
  }
  .btn:hover{opacity:0.88;}
  .footer-note{
    margin-top:36px; font-size:12px; color:var(--text-faint);
    font-family:var(--font-display); font-weight:500; letter-spacing:0.02em;
  }
</style>
</head>
<body>
<div class="video-wrap">
  <video src="/assets/logo-animation.mp4" poster="/assets/logo.png" autoplay muted playsinline></video>
</div>
<div class="card">
  <div class="status">site em construção</div>
  <h1>O ponto onde <em>tudo se conecta</em>.</h1>
  <p>Nutrição e treino desenhados juntos, como um sistema só. A página completa está a caminho — mas os planos já estão disponíveis.</p>
  <a href="/planos/" class="btn">Ver planos</a>
  <p class="footer-note">nexxo · @consultoria.nexxo</p>
</div>
</body>
</html>
